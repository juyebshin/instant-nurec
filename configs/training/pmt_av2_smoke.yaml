# Joint fine-tune of the released pa-multiview model on AV2 (PseudoMapTrainer index), SMOKE.
# Mechanics only (docs/TRAINING.md "bounded end-to-end smoke test"): one step at the
# low-memory 4-frame 196x112 contract, checkpoint, then resume for one more step.
# Joint = render phase with the encoder unfrozen and the released Gaussian head kept.
seed: 38
out_dir: /home1/irteam/workspace/PseudoMapTrainer/RoGS/output/inurec_finetune/runs
phase: render
reference_profile: full-model-front-v1

logger:
  name: csv
  run_name: pmt-av2-smoke

dataset:
  train: &train_pmt
    index_paths:
      - /home1/irteam/workspace/instant-nurec/data/index/av2/00a6ffc1-6ce9-3bc3-a060-6006e9893a1a.pkl
    camera_ids: [ring_front_center, ring_front_right, ring_front_left, ring_rear_right, ring_rear_left,
                 ring_side_right, ring_side_left]
    camera_subsampler: {frame_width: 196, frame_height: 112}
    n_frames_per_sample: 4
    n_samples_per_sequence: 2
    frame_gap_us: 500000
    supervision_frame_batch:
      n_frames_per_camera: 1
      prepend_timestamps_us: 100000
      append_timestamps_us: 100000
      sample_strategy: random
      camera_subsampler: {frame_width: 196, frame_height: 112}
  val:
    <<: *train_pmt

model:
  freeze_encoder: false
  init_weights_paths:
    full: /home1/irteam/workspace/instant-nurec/checkpoints/pth/instant_nurec_pa_multiview_1.1.0.pth
  init_full_keep_heads: true
  post_processing:
    enabled: true
    optimization_start_global_step: 1000
  decoder:
    name: dpt-decoder
    n_semantic_classes: 8

system:
  max_epochs: 1
  train_batch_size: 1
  val_batch_size: 1
  train_num_workers: 0
  val_num_workers: 0
  precision: bf16-mixed
  accelerator: gpu
  devices: 1
  num_nodes: 1
  strategy: auto
  enable_render_global_step: 0
  limit_train_batches: 1
  limit_val_batches: 1
  log_every_n_steps: 1
  save_every_n_train_steps: 1
  checkpoint_monitor: val/psnr
  checkpoint_mode: max
  save_top_k: 2

# Starting point, not tuned: render-phase weights with the dense terms raised for adaptation
# (depth gradient back to its phase-1 value, semantics 10x for the new classes).
loss:
  primitive_sky_cubemap: 0.01
  primitive_rgb: 0.1
  primitive_distance: 1.0
  primitive_distance_gradient: 1.0
  primitive_semantics: 0.1
  primitive_normal: 0.2
  primitive_velocity: 1.0
  rgb: 1.0
  lpips: 0.2
  distance: 0.1
  background: 2.0
