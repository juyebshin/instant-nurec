# SMOKE of pmt_openscene_motion.yaml at its full contract (8 cameras, T=8, 504x280 context and supervision,
# cuboid tracks on): one OpenScene geo-train run, batch 2 on one GPU, 2 steps + val. Checks that 8-camera
# undistorted OpenScene batches with cuboid tracks train with finite losses, that primitive_velocity is computed
# (not skipped), and that it saves; peak memory per GPU at the full config's batch 2 and s/step. Not a quality result.
seed: 38
out_dir: checkpoints/training     # relative to the repo root (scripts/train_pmt_av2_nusc.sh cds there)
phase: render
reference_profile: full-model-front-v1

logger:
  name: csv
  run_name: pmt-openscene-motion-smoke

_sampling: &sampling
  camera_subsampler: {frame_width: 504, frame_height: 280}
  n_frames_per_sample: 8
  frame_gap_us: 500000
  semantic_remap: {5: 3, 6: 3, 7: 0}
  cuboid_tracks: {}
  supervision_frame_batch:
    n_frames_per_camera: 1
    prepend_timestamps_us: 100000
    append_timestamps_us: 100000
    sample_strategy: random
    camera_subsampler: {frame_width: 504, frame_height: 280}
    include_context_frames: true
_openscene_cams: &openscene_cams [CAM_F0, CAM_L0, CAM_R0, CAM_L1, CAM_R1, CAM_L2, CAM_R2, CAM_B0]

dataset:
  train:
    <<: *sampling
    index_paths: [/home1/irteam/workspace/PseudoMapTrainer/RoGS/output/inurec_finetune/index/geo/openscene/train/2021.05.12.19.36.12_veh-35_00215_00405_0-379.pkl]
    camera_ids: *openscene_cams
    n_samples_per_sequence: 4
  val:
    <<: *sampling
    index_paths: [/home1/irteam/workspace/PseudoMapTrainer/RoGS/output/inurec_finetune/index/geo/openscene/train/2021.05.12.19.36.12_veh-35_00215_00405_0-379.pkl]
    camera_ids: *openscene_cams
    n_samples_per_sequence: 1

model:
  freeze_encoder: false
  init_weights_paths:
    full: /home1/irteam/workspace/instant-nurec/checkpoints/pth/instant_nurec_pa_multiview_1.1.0.pth
  init_full_keep_heads: true
  post_processing:
    enabled: true
    optimization_start_global_step: 1000
  decoder:
    name: dpt-decoder
    n_semantic_classes: 5

system:
  max_epochs: 1
  train_batch_size: 2
  val_batch_size: 1
  train_num_workers: 4
  val_num_workers: 2
  precision: bf16-mixed
  accelerator: gpu
  devices: 1
  num_nodes: 1
  strategy: auto
  enable_render_global_step: 0
  limit_train_batches: 2
  limit_val_batches: 1
  log_every_n_steps: 1
  save_every_n_train_steps: 2
  checkpoint_monitor: val/psnr
  checkpoint_mode: max
  save_top_k: 2
  optimizer:
    lr: 2.0e-5
  scheduler:
    warmup_steps: 500

# As pmt_openscene_motion.yaml.
loss:
  primitive_sky_cubemap: 0.01
  primitive_rgb: 0.1
  primitive_distance: 1.0
  primitive_distance_gradient: 1.0
  primitive_semantics: 0.1
  primitive_normal: 0.2
  primitive_velocity: 1.0
  rgb: 1.0
  lpips: 0.2
  distance: 0.1
  background: 2.0
  background_requires_semantics: true
