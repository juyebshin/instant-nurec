# Joint fine-tune of the released pa-multiview model on AV2 + nuScenes + Waymo, on the geographically
# disjoint "near" splits that PseudoMapTrainer (AV2, nuScenes) and mapnn (all three) train and evaluate on.
# Same recipe as pmt_av2_nusc.yaml (4 GPUs x batch 2, lr 5.7e-5, 504x280 context and supervision,
# released init) except: (1) geo splits instead of the official ones; (2) Waymo added (5 cameras);
# (3) background_requires_semantics, because Waymo frames may lack masks; (4) the released 5-class head
# (OTHERS, EGO, SKY, ROAD, MOVABLE) instead of the 8-class one (2026-11-22): the 8-class runs barely
# predict CROSSWALK, so LANE and CROSSWALK labels fold into ROAD and BOUNDARY into OTHERS (semantic_remap),
# and map classes are assigned after the fact (projection + voting, or RoGS optimisation).
#
# Index tree: data/index/geo, built by scripts/index/export_geo.sh.
# Train: 695 AV2 x 5 + 554 nuScenes x 6 + 700 Waymo x 5 = 10299 samples (about a third each).
#   nuScenes geo-train lists 657 scenes; 103 are from the official test split, which has no MoGe depth.
# Val: 25 AV2 of 150, 25 nuScenes of 99, 25 Waymo of 151 geo-val logs (fixed draw).
# Geo-test (AV2 150, nuScenes 137, Waymo 149) is not indexed: held out.
#
# Labels: depth = DVGT LiDAR-aligned MoGe-3 on 2 Hz frames (all three); semantics = M2F masks. Waymo masks
# come from PMT Mask2Former/demo/inference_waymo.py and are in the index only after a re-export
# (REEXPORT_WAYMO=1 scripts/index/export_geo.sh); without them Waymo frames carry semantic_class 255, so a Waymo
# batch skips the semantic loss and trains no sky cubemap. Waymo images and masks are undistorted on
# load (index `distortion`), and depth
# covers only the upper ~55% of the side cameras (DVGT crops around their high principal point).
seed: 38
out_dir: checkpoints/training     # relative to the repo root (scripts/train_pmt_av2_nusc.sh cds there)
phase: render
reference_profile: full-model-front-v1

logger:
  name: csv
  run_name: pmt-geo-av2-nusc-waymo

_sampling: &sampling
  camera_subsampler: {frame_width: 504, frame_height: 280}
  n_frames_per_sample: 8
  frame_gap_us: 500000
  semantic_remap: {5: 3, 6: 3, 7: 0}   # index LUT is 8-class: LANE, CROSSWALK -> ROAD; BOUNDARY -> OTHERS
  supervision_frame_batch:
    n_frames_per_camera: 1
    prepend_timestamps_us: 100000
    append_timestamps_us: 100000
    sample_strategy: random
    camera_subsampler: {frame_width: 504, frame_height: 280}
    include_context_frames: true
_av2_cams: &av2_cams [ring_front_center, ring_front_right, ring_front_left, ring_rear_right, ring_rear_left,
                      ring_side_right, ring_side_left]
_nusc_cams: &nusc_cams [CAM_FRONT, CAM_FRONT_LEFT, CAM_FRONT_RIGHT, CAM_BACK, CAM_BACK_LEFT, CAM_BACK_RIGHT]
_waymo_cams: &waymo_cams [FRONT, FRONT_LEFT, FRONT_RIGHT, SIDE_LEFT, SIDE_RIGHT]

dataset:
  train:
    mixture:
      av2:
        config:
          <<: *sampling
          index_paths: [/home1/irteam/workspace/instant-nurec/data/index/geo/av2/train]
          camera_ids: *av2_cams
          n_samples_per_sequence: 5
      nusc:
        config:
          <<: *sampling
          index_paths: [/home1/irteam/workspace/instant-nurec/data/index/geo/nusc/train]
          camera_ids: *nusc_cams
          n_samples_per_sequence: 6
      waymo:
        config:
          <<: *sampling
          index_paths: [/home1/irteam/workspace/instant-nurec/data/index/geo/waymo/train]
          camera_ids: *waymo_cams
          n_samples_per_sequence: 5
  val:
    mixture:
      av2:
        sample_ratio: 0.17        # 25 of 150 geo-val logs
        config:
          <<: *sampling
          index_paths: [/home1/irteam/workspace/instant-nurec/data/index/geo/av2/val]
          camera_ids: *av2_cams
          n_samples_per_sequence: 1
      nusc:
        sample_ratio: 0.26        # 25 of 99 geo-val scenes
        config:
          <<: *sampling
          index_paths: [/home1/irteam/workspace/instant-nurec/data/index/geo/nusc/val]
          camera_ids: *nusc_cams
          n_samples_per_sequence: 1
      waymo:
        sample_ratio: 0.17        # 25 of 151 geo-val segments
        config:
          <<: *sampling
          index_paths: [/home1/irteam/workspace/instant-nurec/data/index/geo/waymo/val]
          camera_ids: *waymo_cams
          n_samples_per_sequence: 1

model:
  freeze_encoder: false
  init_weights_paths:
    full: /home1/irteam/workspace/instant-nurec/checkpoints/pth/instant_nurec_pa_multiview_1.1.0.pth
  init_full_keep_heads: true
  post_processing:
    enabled: true
    optimization_start_global_step: 1000
  decoder:
    name: dpt-decoder
    n_semantic_classes: 5          # released head as is; no widening

system:
  max_epochs: 2                  # 10299 samples / epoch = 5150 one-dataset batches = 1288 steps on 4 GPUs
  train_batch_size: 2
  val_batch_size: 2
  train_num_workers: 16
  val_num_workers: 4
  precision: bf16-mixed
  accelerator: gpu
  devices: 4                     # DDP: launch with TORCH_NCCL_USE_COMM_NONBLOCKING=0 NCCL_COMM_BLOCKING=1
  num_nodes: 1
  strategy: auto
  enable_render_global_step: 0
  limit_val_batches: 50
  log_every_n_steps: 10
  save_every_n_train_steps: 1000
  checkpoint_monitor: val/psnr
  checkpoint_mode: max
  save_top_k: 2
  optimizer:
    lr: 5.7e-5                   # pilot's 2e-5 at batch 1, x sqrt(8) for total batch 8 (4 GPUs x 2)
  scheduler:
    warmup_steps: 500

# As pmt_av2_nusc.yaml. A render-phase loss block must list every weight (omitted ones become 0).
loss:
  primitive_sky_cubemap: 0.01
  primitive_rgb: 0.1
  primitive_distance: 1.0
  primitive_distance_gradient: 1.0
  primitive_semantics: 0.1
  primitive_normal: 0.2
  primitive_velocity: 1.0
  rgb: 1.0
  lpips: 0.2
  distance: 0.1
  background: 2.0
  background_requires_semantics: true   # unmasked (Waymo) sky must not be a foreground target
